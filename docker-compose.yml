# PCOD Prediction — one-command start for MySQL + backend + frontend.
#
#   docker compose up --build
#
# Then open http://localhost:5173 (frontend) — the API is on
# http://localhost:8080 (Swagger UI: http://localhost:8080/swagger-ui.html).
#
# First run: the backend container needs the trained models, which are baked
# into the jar at image build time (mvn package), and MySQL, which is
# created empty here (database pcod_db + prediction_records table are
# created automatically on first connect/startup). Stop with
# `docker compose down` (add -v to also delete the MySQL data volume).
#
# Retrained artefacts (POST /api/retrain) are written to /app/resources in
# the backend container and kept in the named volume `pcod-resources`, so
# they survive container recreation — the backend loads them from that
# directory on the next start instead of the jar's baked-in models.
#
# Secrets: MYSQL_ROOT_PASSWORD, MYSQL_APP_PASSWORD and ADMIN_KEY are
# REQUIRED — set them in a .env file next to this file (or in the shell)
# before starting. There are no silent defaults: compose refuses to start
# without them. MySQL's port
# 3306 is NOT published to the host (the backend reaches MySQL over the
# compose network); for direct host access use
# `docker exec -it pcod-mysql mysql -uroot -p`.

services:
  mysql:
    image: mysql:8.0
    container_name: pcod-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: pcod_db
      # Dedicated app user, created automatically on FIRST init only (an
      # existing mysql-data volume keeps its old users — create pcod_app
      # manually there, see backend/README.md). The app never connects as
      # root; root is used only by the healthcheck below.
      MYSQL_USER: ${MYSQL_APP_USER:-pcod_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: pcod-backend
    environment:
      # The backend reaches MySQL as service "mysql" inside this network.
      # MySQL 8's default auth asks the driver for a public key on first
      # connect; allowPublicKeyRetrieval=true lets the driver fetch it
      # (same fix as the laptop's standalone MySQL).
      MYSQL_URL: jdbc:mysql://mysql:3306/pcod_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_APP_USER:-pcod_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      # Admin key for the protected endpoints (X-Admin-Key header: retrain,
      # prediction history, verified outcomes). REQUIRED — when it is empty
      # those endpoints refuse every request (fail-closed).
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      # Dataset CSV for POST /api/retrain (mounted read-only below).
      PCOD_DATASET_PATH: /app/data/pcos_dataset.csv
      PCOD_RESOURCES_DIR: /app/resources
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
      - pcod-resources:/app/resources
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pcod-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
  pcod-resources:
