# nginx for the PCOD frontend container: serves the Vite production bundle
# and proxies /api to the backend service (http://backend:8080) inside the
# Docker Compose network, so the browser never talks to the backend
# directly and no CORS / absolute API URL is needed.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
