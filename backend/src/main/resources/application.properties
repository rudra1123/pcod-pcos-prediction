server.port=8080
spring.application.name=pcod-prediction-backend
# Dataset location used by POST /api/retrain (relative to the working directory
# when the app is started from backend/, i.e. ../data/pcos_dataset.csv).
pcod.dataset.path=${PCOD_DATASET_PATH:../data/pcos_dataset.csv}
# Where retrained artefacts are written when /api/retrain is called.
pcod.resources.dir=${PCOD_RESOURCES_DIR:src/main/resources}
logging.level.com.pcod=INFO

# --- MySQL database (prediction history) ---
# MySQL Server 8.x must be installed and RUNNING before the backend starts —
# the app creates its connection pool at startup and will fail to start if
# MySQL is down. Full setup (install, create database/user, set password):
# see the "Database (MySQL)" section of README.md.
# The database `pcod_db` is created automatically on first connect
# (createDatabaseIfNotExist=true); the `prediction_records` table is created
# automatically by schema.sql (ddl-auto=none — Hibernate does NOT manage
# the schema; see below).
# Credentials: override with environment variables — never hard-code a real
# password in this file. MYSQL_PASSWORD is required when the MySQL user has
# one (the default below is an empty password, for a local root account
# without a password).
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/pcod_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Schema: created by schema.sql (src/main/resources/schema.sql), NOT by
# Hibernate — ddl-auto=none, and the init script runs after JPA bootstrap
# (defer-datasource-initialization). The script is idempotent
# (CREATE TABLE IF NOT EXISTS), so re-runs are safe.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Admin key for the protected endpoints (header X-Admin-Key): POST
# /api/retrain, GET /api/predictions, GET /api/predictions/{id},
# PATCH /api/predictions/{id}/outcome, GET /api/retrain/status and
# GET /api/retrain/{jobId}. Set the ADMIN_KEY environment variable.
# FAIL-CLOSED: when it is empty, those endpoints refuse every request
# with 503 — they are never unprotected. Never hard-code a real secret
# in this file. In Docker Compose, ADMIN_KEY is REQUIRED (no default).
pcod.admin.key=${ADMIN_KEY:}
