# Test profile: the prediction-history database is NOT required for the
# unit/smoke tests. Excluding the JPA auto-configuration means no
# DataSource is created and no MySQL server is needed to run `mvn test`;
# PcodController then runs with the history repository absent (predictions
# still work; /api/predictions answers 503). The live MySQL test is
# PredictionHistoryTest, which re-enables JPA with its own properties and
# skips itself when no MySQL server is reachable.
# NOTE (Spring Boot 4.1): the auto-configuration classes moved out of
# spring-boot-autoconfigure into dedicated modules, so the exclude list
# must use the new names — the old
# org.springframework.boot.autoconfigure.jdbc/orm.jpa/data.jpa names no
# longer exist and excluding them silently does nothing (the DataSource
# and JPA auto-configuration then run, and the embedded H2 database
# fails on the MySQL-only schema.sql DDL).
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
