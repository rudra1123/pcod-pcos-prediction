# CI: backend tests (Java 25) + frontend build (Node 24) on every push and PR.
# The 2 live-MySQL tests abort (not fail) when no database is reachable,
# which is the case on the GitHub runner — that is by design.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Backend tests
        run: mvn -B test --file backend/pom.xml

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build
